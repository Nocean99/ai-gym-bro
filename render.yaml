services:
  # PostgreSQL Database
  - type: pserv
    name: gym-bro-db
    env: docker
    plan: free
    ipAllowList: []

  # Flask API Backend
  - type: web
    name: gym-bro-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT backend.api_server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: gym-bro-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: DEBUG
        value: False
